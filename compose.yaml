name: crm-inteligente

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_inteligente
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm_inteligente']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command: npm run dev --workspace=@crm/api
    environment:
      NODE_ENV: development
      API_PORT: 3001
      DATABASE_URL: postgresql://crm:crm@postgres:5432/crm_inteligente?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: development-access-secret-change-before-production
      JWT_REFRESH_SECRET: development-refresh-secret-change-before-production
      JWT_ISSUER: crm-inteligente-api
      JWT_AUDIENCE: crm-inteligente-web
      COOKIE_SECURE: 'false'
      CORS_ORIGIN: http://localhost:3000
      ENABLE_SWAGGER: 'true'
    ports:
      - '3001:3001'
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3001/api/v1/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    command: npm run dev --workspace=@crm/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - '3000:3000'
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  web_node_modules:
